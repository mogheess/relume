name: Windows release

# Runs only on version tags (v0.2.0) or when started by hand, to save Actions minutes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test engine
        run: cargo test --release -p relume-core --lib
      - name: Build
        run: cargo build --release -p relume -p relume-cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/Relume.exe, target/release/relume-cli.exe, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath Relume-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Relume-windows-x64
          path: Relume-windows-x64.zip
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Relume-windows-x64.zip
