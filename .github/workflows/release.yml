name: Windows release

# Runs on version tags (v0.2.0) or when started by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test engine
        run: cargo test --release -p relume-core --lib
      - name: Build
        run: cargo build --release -p relume -p relume-cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/Relume.exe, target/release/relume-cli.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath dist/Relume-windows-x64.zip -Force
          Push-Location dist
          Get-FileHash Relume.exe, relume-cli.exe, Relume-windows-x64.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: Relume-windows-x64
          path: |
            dist/Relume.exe
            dist/relume-cli.exe
            dist/Relume-windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Relume ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist/Relume.exe
            dist/relume-cli.exe
            dist/Relume-windows-x64.zip
            dist/SHA256SUMS.txt
