[package]
name = "relume-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Relume recovery engine: file system scanning, signature carving and validation for photos and videos"

[features]
# Test-only hooks (scan throttling for UI screenshots). Never enabled in release builds.
dev-hooks = []

[dependencies]
crc32fast = "1"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Ioctl",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
