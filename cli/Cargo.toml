[package]
name = "relume-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Relume command line: guided and scriptable photo and video recovery"
build = "build.rs"

[[bin]]
name = "relume-cli"
path = "src/main.rs"

[dependencies]
relume-core = { path = "../core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[build-dependencies]
embed-resource = "3"
